worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout  65;
  client_max_body_size 25m;

  # Trust docker's embedded resolver so upstream DNS resolves at request time.
  resolver 127.0.0.11 valid=30s ipv6=off;

  # Shared proxy defaults
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # ---------------------------------------------------------------------------
  # API — api.platform.local → api:3001
  # ---------------------------------------------------------------------------
  server {
    listen 80;
    server_name api.platform.local;

    location / {
      proxy_pass http://api:3001;
    }
  }

  # ---------------------------------------------------------------------------
  # Tenant admin — admin.platform.local → tenant-admin:3000
  # ---------------------------------------------------------------------------
  server {
    listen 80;
    server_name admin.platform.local;

    location / {
      proxy_pass http://tenant-admin:3000;
    }
  }

  # ---------------------------------------------------------------------------
  # Landlord admin — landlord.platform.local → landlord-admin:3000
  # ---------------------------------------------------------------------------
  server {
    listen 80;
    server_name landlord.platform.local;

    location / {
      proxy_pass http://landlord-admin:3000;
    }
  }

  # ---------------------------------------------------------------------------
  # Storefront — everything else (*.storefront.local, apex, etc.) → storefront:3000
  # The storefront resolves the tenant from the Host header (X-Tenant-Subdomain
  # fallback is set by the app itself).
  # ---------------------------------------------------------------------------
  server {
    listen 80 default_server;
    server_name _;

    location / {
      proxy_pass http://storefront:3000;
    }
  }
}
